name: native-build

# Builds the atrium-search native addon (.node) for each supported target and
# uploads it as an artifact. The addon is Atrium's only search engine, so each
# platform needs its prebuilt to search. A platform with no prebuilt has no
# search engine and fails hard, which `atrium doctor` reports.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.host }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: windows-latest
            target: x86_64-pc-windows-msvc
          - host: macos-latest
            target: aarch64-apple-darwin
          - host: macos-13
            target: x86_64-apple-darwin
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - host: ubuntu-latest
            target: x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          workspaces: crates/atrium-search
      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: bun install --frozen-lockfile
      - name: Build native addon
        run: >
          bunx napi build --release --platform
          --target ${{ matrix.target }}
          --js-package-name atrium-search
          --manifest-path crates/atrium-search/Cargo.toml
          --output-dir crates/atrium-search
      - uses: actions/upload-artifact@v4
        with:
          name: atrium-search-${{ matrix.target }}
          path: crates/atrium-search/*.node
          if-no-files-found: error
